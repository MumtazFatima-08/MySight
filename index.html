<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MySight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171c;
    --surface: #1c2029;
    --line: #2c313d;
    --text: #ecebe4;
    --text-dim: #8b92a0;
    --beacon: #ffb13d;
    --safety: #ff5a5f;
    --confirm: #4fd1c5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif;
  }
  h1, .display { font-family: 'Space Grotesk', sans-serif; }

  .app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------- START SCREEN ---------- */
  #startScreen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 32px; text-align: center; background: var(--bg);
  }
  #startScreen h1 { font-size: 28px; margin: 0; }
  #startScreen p { color: var(--text-dim); font-size: 15px; max-width: 320px; margin: 0; line-height: 1.5; }
  #startBtn {
    width: min(78vw, 320px); height: min(78vw, 320px);
    border-radius: 50%; border: none;
    background: var(--beacon); color: #1a1300;
    font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 10px rgba(255,177,61,0.12);
    cursor: pointer;
  }
  #startBtn:active { transform: scale(0.97); }
  #startScreen .hint { font-size: 13px; color: var(--text-dim); }

  /* ---------- MAIN SCREEN ---------- */
  #mainScreen { display: none; flex-direction: column; height: 100%; }
  #mainScreen.active { display: flex; }

  .camera-wrap { position: relative; flex: 1; min-height: 0; background: #05060a; overflow: hidden; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  canvas.overlay { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }

  .camera-wrap.alert { box-shadow: inset 0 0 0 6px var(--safety); }

  .top-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: max(14px, env(safe-area-inset-top)) 14px 0;
    pointer-events: none;
  }
  .pill {
    background: rgba(20,23,28,0.72); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 999px;
    padding: 8px 14px; font-size: 13px; color: var(--text-dim);
    display: flex; align-items: center; gap: 7px;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
  .pill.safe .dot { background: var(--confirm); }
  .pill.warn .dot { background: var(--safety); }
  .pill.listening .dot { background: var(--beacon); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  .caption-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(5,6,10,0.92), rgba(5,6,10,0));
  }
  .caption-bar .current {
    font-size: 17px; font-weight: 500; line-height: 1.35; min-height: 24px;
  }
  .caption-bar .current.safety { color: var(--safety); font-weight: 600; }
  .caption-bar .current.sign { color: var(--confirm); font-weight: 600; }

  .speak-btn {
    position: absolute; right: 16px; bottom: calc(78px + env(safe-area-inset-bottom));
    z-index: 6;
    width: 62px; height: 62px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    background: var(--beacon); color: #1a1300;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; cursor: pointer;
  }
  .speak-btn.listening { background: var(--safety); animation: pulse 1s infinite; }

  .transcript-toggle {
    position: absolute; left: 16px; bottom: calc(78px + env(safe-area-inset-bottom));
    z-index: 6; background: rgba(20,23,28,0.72); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-dim); border-radius: 999px; padding: 10px 14px; font-size: 12px;
  }

  #transcriptPanel {
    display: none; position: absolute; inset: 0; z-index: 8;
    background: rgba(10,11,14,0.94); backdrop-filter: blur(4px);
    padding: max(20px, env(safe-area-inset-top)) 18px 18px; overflow-y: auto;
  }
  #transcriptPanel.open { display: block; }
  #transcriptPanel h2 { font-size: 16px; margin: 0 0 12px; }
  .log-entry { font-size: 14px; line-height: 1.4; margin-bottom: 10px; display: flex; gap: 8px; }
  .log-entry .time { color: var(--text-dim); font-size: 11px; min-width: 40px; padding-top: 2px; }
  .log-entry.safety .text { color: var(--safety); font-weight: 600; }
  .log-entry.sign .text { color: var(--confirm); font-weight: 600; }
  .log-entry.system .text { color: var(--text-dim); }
  .close-transcript {
    position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; width: 36px; height: 36px; font-size: 16px;
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);
  }
</style>
</head>
<body>
<div class="app">

  <div id="startScreen">
    <h1>MySight</h1>
    <p>Tap the button, then just talk. MySight will ask where you want to go and guide you there by voice.</p>
    <button id="startBtn" aria-label="Start MySight">Start</button>
    <div class="hint">One tap. Camera and microphone permission will be requested.</div>
  </div>

  <div id="mainScreen">
    <div class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas class="overlay" id="overlay"></canvas>

      <div class="top-bar">
        <span class="pill safe" id="safetyPill"><span class="dot"></span><span>Path clear</span></span>
        <span class="pill" id="listenPill"><span class="dot"></span><span>Idle</span></span>
      </div>

      <button class="transcript-toggle" id="transcriptToggleBtn">Transcript</button>
      <button class="speak-btn" id="speakBtn" aria-label="Speak a destination">🎙</button>

      <div class="caption-bar">
        <div class="current" id="currentCaption">Say "Start" was tapped. Getting ready…</div>
      </div>

      <div id="transcriptPanel">
        <button class="close-transcript" id="closeTranscriptBtn" aria-label="Close transcript">✕</button>
        <h2>Full transcript</h2>
        <div id="logList"></div>
      </div>
    </div>
  </div>

  <div aria-live="polite" class="visually-hidden" id="ariaLive"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>

<script>
(function(){
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');
  const mainScreen = document.getElementById('mainScreen');
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const ctx = overlay.getContext('2d');
  const cameraWrap = document.getElementById('cameraWrap');
  const safetyPill = document.getElementById('safetyPill');
  const listenPill = document.getElementById('listenPill');
  const currentCaption = document.getElementById('currentCaption');
  const speakBtn = document.getElementById('speakBtn');
  const transcriptToggleBtn = document.getElementById('transcriptToggleBtn');
  const closeTranscriptBtn = document.getElementById('closeTranscriptBtn');
  const transcriptPanel = document.getElementById('transcriptPanel');
  const logList = document.getElementById('logList');
  const ariaLive = document.getElementById('ariaLive');

  const HAZARD_CLASSES = new Set([
    'person','chair','couch','bench','dining table','suitcase','backpack',
    'bicycle','motorcycle','car','potted plant','umbrella','handbag',
    'skateboard','fire hydrant','stop sign'
  ]);

  let model = null;
  let stream = null;
  let destination = '';
  let obstacleLoopId = null;
  let signScanLoopId = null;
  let lastSafetySpokenAt = 0;
  let recognition = null;
  let recognitionActive = false;
  let awaitingDestination = false;
  let speaking = false;

  const hasSpeechRecognition = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;
  const hasSpeechSynthesis = 'speechSynthesis' in window;

  function log(text, kind){
    currentCaption.textContent = text;
    currentCaption.className = 'current ' + (kind || '');
    ariaLive.textContent = text;

    const row = document.createElement('div');
    row.className = 'log-entry ' + (kind || 'system');
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const txt = document.createElement('span');
    txt.className = 'text';
    txt.textContent = text;
    row.appendChild(time); row.appendChild(txt);
    logList.appendChild(row);
    logList.scrollTop = logList.scrollHeight;
  }

  function setListenState(state){
    // state: 'idle' | 'listening' | 'thinking'
    listenPill.className = 'pill' + (state === 'listening' ? ' listening' : '');
    listenPill.querySelector('span:last-child').textContent =
      state === 'listening' ? 'Listening…' : state === 'thinking' ? 'Thinking…' : 'Idle';
    speakBtn.classList.toggle('listening', state === 'listening');
  }

  function speak(text, kind, onDone){
    log(text, kind);
    if (!hasSpeechSynthesis) { if (onDone) onDone(); return; }
    // pause recognition while speaking so the app doesn't hear itself
    stopRecognition();
    speaking = true;
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.02;
    utter.onend = utter.onerror = () => {
      speaking = false;
      if (onDone) onDone();
    };
    if (kind === 'safety') window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  function setSafety(isWarning){
    if (isWarning) {
      safetyPill.className = 'pill';
      safetyPill.querySelector('span:last-child').textContent = 'Obstacle ahead';
      safetyPill.querySelector('.dot').style.background = 'var(--safety)';
      cameraWrap.classList.add('alert');
    } else {
      safetyPill.className = 'pill safe';
      safetyPill.querySelector('span:last-child').textContent = 'Path clear';
      cameraWrap.classList.remove('alert');
    }
  }

  // ---------- Camera + detection ----------
  async function startCamera(){
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    resizeOverlay();
    window.addEventListener('resize', resizeOverlay);

    try {
      model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    } catch (e) {
      log('Obstacle model failed to load: ' + e.message, 'system');
    }
    startObstacleLoop();
  }

  function resizeOverlay(){
    overlay.width = video.videoWidth || video.clientWidth;
    overlay.height = video.videoHeight || video.clientHeight;
  }

  function startObstacleLoop(){
    if (obstacleLoopId) return;
    obstacleLoopId = setInterval(async () => {
      if (!model || !video.videoWidth || speaking) return;
      let predictions = [];
      try { predictions = await model.detect(video); } catch (e) { return; }

      ctx.clearRect(0,0,overlay.width, overlay.height);
      const w = overlay.width, h = overlay.height;
      let hazard = null;

      predictions.forEach(p => {
        const [x,y,bw,bh] = p.bbox;
        const isHazard = HAZARD_CLASSES.has(p.class);
        ctx.strokeStyle = isHazard ? '#ff5a5f' : '#4fd1c5';
        ctx.lineWidth = 2;
        ctx.strokeRect(x,y,bw,bh);
        if (isHazard) {
          const cy = y + bh/2;
          const inLowerPath = cy > h * 0.35;
          const closeEnough = (bw*bh) > (w*h*0.05);
          if (inLowerPath && closeEnough) {
            if (!hazard || (bw*bh) > (hazard.bbox[2]*hazard.bbox[3])) hazard = p;
          }
        }
      });

      if (hazard) {
        const [x,,bw] = hazard.bbox;
        const cx = x + bw/2;
        const direction = cx < w/2 ? 'right' : 'left';
        setSafety(true);
        const now = Date.now();
        if (now - lastSafetySpokenAt > 3000) {
          speak('Obstacle ahead. Move slightly ' + direction + '.', 'safety');
          lastSafetySpokenAt = now;
        }
      } else {
        setSafety(false);
      }
    }, 700);
  }

  async function scanForSign(){
    if (!video.videoWidth || !destination || speaking) return;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    try {
      const result = await Tesseract.recognize(canvas, 'eng');
      const text = (result?.data?.text || '').toLowerCase();
      if (text.includes(destination.toLowerCase())) {
        speak(destination + ' ahead.', 'sign');
      }
    } catch (e) { /* ignore, try again next cycle */ }
  }

  function startSignSearch(dest){
    destination = dest;
    if (signScanLoopId) clearInterval(signScanLoopId);
    scanForSign();
    signScanLoopId = setInterval(scanForSign, 4000);
  }

  // ---------- Voice input ----------
  function initRecognition(){
    if (!hasSpeechRecognition) return;
    const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new Ctor();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = (e) => {
      const heard = e.results[0][0].transcript.trim();
      log('Heard: "' + heard + '"', 'system');
      handleVoiceInput(heard);
    };
    recognition.onerror = (e) => {
      recognitionActive = false;
      setListenState('idle');
      if (e.error === 'no-speech') {
        speak('I didn\'t catch that. Tap the microphone and tell me where you want to go.', 'system');
      }
    };
    recognition.onend = () => {
      recognitionActive = false;
      setListenState('idle');
    };
  }

  function startRecognition(){
    if (!recognition || recognitionActive || speaking) return;
    try {
      recognition.start();
      recognitionActive = true;
      setListenState('listening');
    } catch (e) { /* already started */ }
  }

  function stopRecognition(){
    if (recognition && recognitionActive) {
      try { recognition.stop(); } catch(e){}
    }
    recognitionActive = false;
  }

  function extractDestination(phrase){
    let p = phrase.toLowerCase();
    p = p.replace(/^(find|go to|take me to|navigate to|i want to go to|i need to find)\s+/i, '');
    p = p.replace(/^the\s+/i, '');
    return p.trim().replace(/[.?!]+$/, '');
  }

  function handleVoiceInput(heard){
    const dest = extractDestination(heard);
    if (!dest) {
      speak('Sorry, I didn\'t get a destination. Tap the microphone and try again.', 'system');
      return;
    }
    const cap = dest.charAt(0).toUpperCase() + dest.slice(1);
    startSignSearch(cap);
    speak('Looking for ' + cap + '. I\'ll tell you when I see it, and warn you about anything in your path.', 'system', () => {
      // resume listening for a possible new destination later, idle otherwise
    });
  }

  function askForDestination(){
    speak('Where do you want to go?', 'system', () => {
      startRecognition();
    });
  }

  // ---------- Wiring ----------
  speakBtn.addEventListener('click', () => {
    if (recognitionActive) { stopRecognition(); return; }
    if (speaking) return;
    startRecognition();
  });

  transcriptToggleBtn.addEventListener('click', () => transcriptPanel.classList.add('open'));
  closeTranscriptBtn.addEventListener('click', () => transcriptPanel.classList.remove('open'));

  startBtn.addEventListener('click', async () => {
    startScreen.style.display = 'none';
    mainScreen.classList.add('active');
    try {
      await startCamera();
    } catch (e) {
      speak('I could not access the camera. Please allow camera access and reload the page.', 'system');
      return;
    }
    initRecognition();
    if (!hasSpeechRecognition) {
      speak('Voice input is not supported in this browser. Please use Chrome on Android, or a desktop Chrome browser.', 'system');
      return;
    }
    askForDestination();
  });
})();
</script>
</body>
</html>
