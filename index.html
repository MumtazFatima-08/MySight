<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MySight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <div id="startScreen">
    <h1>MySight</h1>
    <p id="startStatus" aria-live="polite">Welcome to MySight. Tap once to start.</p>
    <button id="startBtn" aria-label="Start MySight">Start</button>
    <div class="hint">Camera and microphone permission will be requested.</div>
    <a href="diagnostics.html" class="diag-link">Having trouble? Run diagnostics</a>
  </div>

  <div id="mainScreen">
    <div class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas class="overlay" id="overlay"></canvas>

      <div class="top-bar">
        <span class="pill" id="statePill"><span class="dot"></span><span id="statePillText">Idle</span></span>
      </div>

      <button class="mic-btn" id="micBtn" aria-label="Tap to talk to MySight">🎙</button>

      <div class="caption-bar">
        <div class="current" id="currentCaption">—</div>
      </div>

      <!-- Shown only if voice recognition is unsupported on this browser -->
      <div id="fallbackControls" class="fallback-controls" hidden>
        <button id="fbDescribe">What do you see</button>
        <button id="fbFindChair">Find a chair</button>
        <button id="fbRead">Read this</button>
        <button id="fbStop">Stop</button>
      </div>
    </div>
  </div>

  <!-- Developer/debug view. Separate from the blind-user experience:
       only appears when the page is opened with ?debug=1 -->
  <div id="debugPanel" class="debug-panel" hidden>
    <h2>Debug</h2>
    <pre id="debugContent"></pre>
  </div>

  <div aria-live="assertive" class="visually-hidden" id="ariaLive"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
